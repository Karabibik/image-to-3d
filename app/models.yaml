# Model catalogue for the UI and orchestrator.
#
# workers: one process per model, started on demand inside its own venv. Only one runs
#          at a time so each gets the whole GPU. Paths are inside the Docker image.
# generators / refiners / painters: what the UI offers. `params` become controls under
#          Advanced and are passed to the worker unchanged. `hint` is the one line above them.
# input: "multiview" for generators that take turnaround views instead of one image.
# up: up axis of the mesh the model writes (all write glTF, which is Y-up).

#
# prefetch: Hugging Face repos `python -m app.prefetch <worker...>` downloads ahead of
#           first use (PREFETCH_MODELS on the pod). Workers fetch anything missing anyway.
_safetensors_only: &safetensors_only {allow: ["*.json", "*.txt", "model.safetensors"]}

workers:
  hunyuan:
    python: /opt/venvs/hunyuan/bin/python
    script: workers/hunyuan_worker.py
    root: /opt/models/Hunyuan3D-2.1
    port: 7871
    prefetch:
      # hy3dshape downloads into $HY3DGEN_MODELS/<repo>, not the HF cache.
      - {repo: tencent/Hunyuan3D-2.1, allow: ["hunyuan3d-dit-v2-1/*"], local_dir: "${HY3DGEN_MODELS}/tencent/Hunyuan3D-2.1"}
  hunyuan2mv:
    # Shares the hunyuan venv: hy3dgen's shape path needs nothing beyond its pins.
    python: /opt/venvs/hunyuan/bin/python
    script: workers/hunyuan2mv_worker.py
    root: /opt/models/Hunyuan3D-2
    port: 7876
    prefetch:
      - {repo: tencent/Hunyuan3D-2mv, allow: ["hunyuan3d-dit-v2-mv/config.yaml", "hunyuan3d-dit-v2-mv/model.fp16.safetensors"],
         local_dir: "${HY3DGEN_MODELS}/tencent/Hunyuan3D-2mv"}
  ultrashape:
    python: /opt/venvs/ultrashape/bin/python
    script: workers/ultrashape_worker.py
    root: /opt/models/UltraShape-1.0
    port: 7872
    prefetch:
      - {repo: infinith/UltraShape, allow: ["ultrashape_v1.pt"]}
      - {repo: facebook/dinov2-large, <<: *safetensors_only}
  hi3d:
    python: /opt/venvs/hi3d/bin/python
    script: workers/hi3d_worker.py
    root: /opt/models/Hi3Dv1.0
    port: 7875
    prefetch:
      # Hi3D's loader rejects any symlink besides its runtime files, so it gets its own
      # cache ($HI3D_CACHE_DIR, also passed by the worker) and only those files.
      - {repo: hi3d-official/Hi3Dv1.0, cache_dir: "${HI3D_CACHE_DIR}",
         allow: ["model_index.json", "scheduler/*", "vae/*", "transformer_512/*", "transformer_1024/*"]}
      - {repo: facebook/dinov2-large, cache_dir: "${HI3D_CACHE_DIR}", <<: *safetensors_only}
      - {repo: openai/clip-vit-large-patch14, cache_dir: "${HI3D_CACHE_DIR}", <<: *safetensors_only}
  hunyuan_paint:
    # Same upstream repo as hunyuan, its own venv so the shape venv stays as tested.
    python: /opt/venvs/hunyuan_paint/bin/python
    script: workers/hunyuan_paint_worker.py
    root: /opt/models/Hunyuan3D-2.1
    port: 7877
    prefetch:
      - {repo: tencent/Hunyuan3D-2.1, allow: ["hunyuan3d-paintpbr-v2-1/*"]}
      - {repo: facebook/dinov2-giant, <<: *safetensors_only}

generators:
  hunyuan:
    label: Hunyuan3D 2.1
    worker: hunyuan
    up: y
    hint: Hunyuan3D 2.1 · about 1 min · 11.5 GB VRAM
    params:
      steps: {type: int, default: 30, min: 5, max: 100, step: 1, label: Inference steps}
      guidance_scale: {type: float, default: 5.0, min: 1.0, max: 15.0, step: 0.5, label: Guidance scale}
      octree_resolution: {type: int, default: 384, min: 256, max: 512, step: 32, label: Mesh grid resolution, info: Higher keeps finer detail; 512 needs more VRAM}
      num_chunks: {type: int, default: 200000, min: 20000, max: 1000000, step: 20000, label: Decode chunk size}
  # Turnaround-sheet generators (input: multiview) get {slot: image} views; the front is required.
  hunyuan2mv:
    label: Hunyuan3D-2mv
    worker: hunyuan2mv
    input: multiview
    up: y
    hint: Hunyuan3D-2mv · about 2 min · 9.5 GB VRAM (Turbo 6 GB)
    params:
      variant: {type: choice, choices: [standard, turbo, fast], default: standard, label: Model variant, info: "Turbo: step-distilled, use 5-10 steps; Fast: guidance-distilled. Each downloads ~5 GB on first use"}
      steps: {type: int, default: 50, min: 5, max: 100, step: 1, label: Inference steps}
      guidance_scale: {type: float, default: 5.0, min: 1.0, max: 15.0, step: 0.5, label: Guidance scale}
      octree_resolution: {type: int, default: 384, min: 256, max: 512, step: 32, label: Mesh grid resolution}
      num_chunks: {type: int, default: 200000, min: 20000, max: 1000000, step: 20000, label: Decode chunk size}
refiners:
  ultrashape:
    label: UltraShape
    worker: ultrashape
    up: y
    hint: The sharpest detail · about 10 min · 18.4 GB VRAM
    params:
      steps: {type: int, default: 50, min: 12, max: 100, step: 1, label: Steps, info: 12 is much faster with a small quality cost}
      octree_res: {type: int, default: 1024, min: 512, max: 2048, step: 128, label: Mesh grid resolution}
      num_latents: {type: int, default: 32768, min: 8192, max: 65536, step: 4096, label: Latent tokens}
      chunk_size: {type: int, default: 8000, min: 2048, max: 32000, step: 1024, label: Decode chunk size}
      low_vram: {type: bool, default: false, label: Low-VRAM mode}
  hi3d:
    label: Hi3D (experimental)
    worker: hi3d
    up: y
    hint: About 7 min · 20 GB VRAM · CPU offload 11 GB, 1.5× slower
    params:
      resolution: {type: choice, choices: ["512", "1024", "1536"], default: "1024", label: Resolution, info: 1536 was only validated on a 96 GB GPU}
      steps: {type: int, default: 25, min: 10, max: 50, step: 1, label: Steps per pass}
      cpu_offload: {type: bool, default: false, label: Sequential CPU offload, info: "Slower, lowers VRAM"}
painters:
  hunyuan_paint:
    label: Hunyuan3D-Paint 2.1
    worker: hunyuan_paint
    hint: Colors from the front image only; the back and sides are invented. Upstream says 21 GB VRAM.
    params:
      faces: {type: int, default: 40000, min: 10000, max: 200000, step: 10000, label: Triangles, info: The painted model is a separate copy; the print mesh keeps its detail}
      max_num_view: {type: choice, choices: [6, 8], default: 6, label: Views painted}
      resolution: {type: choice, choices: [512, 768], default: 512, label: View resolution}

print:
  heights_mm: [28, 32, 54, 75]
  faces: {"40k": 40000, "200k": 200000, "500k": 500000, "Keep all": 0}
  defaults:
    target_height_mm: 32
    target_faces: 200000
    flatten_base_mm: 0.3
    min_component_ratio: 0.02
    remesh_if_open: true
    remesh_cell_mm: 0.05

background_removal:
  # rembg model used when an upload has no transparency.
  models: [birefnet-general, isnet-general-use, u2net]
  default: birefnet-general
