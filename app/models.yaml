# Model catalogue for the UI and orchestrator.
#
# workers: one process per model, started on demand inside its own venv. Only one runs
#          at a time so each gets the whole GPU. Paths are inside the Docker image.
# generators / refiners: what the UI offers. `params` become UI controls and are passed
#          to the worker unchanged. `advanced: true` puts a control in a collapsed panel.
# up: up axis of the mesh the model writes (all write glTF, which is Y-up).

#
# prefetch: Hugging Face repos `python -m app.prefetch <worker...>` downloads ahead of
#           first use (PREFETCH_MODELS on the pod). Workers fetch anything missing anyway.
_safetensors_only: &safetensors_only {allow: ["*.json", "*.txt", "model.safetensors"]}

workers:
  hunyuan:
    python: /opt/venvs/hunyuan/bin/python
    script: workers/hunyuan_worker.py
    root: /opt/models/Hunyuan3D-2.1
    port: 7871
    prefetch:
      - {repo: tencent/Hunyuan3D-2.1, allow: ["hunyuan3d-dit-v2-1/*"]}
  ultrashape:
    python: /opt/venvs/ultrashape/bin/python
    script: workers/ultrashape_worker.py
    root: /opt/models/UltraShape-1.0
    port: 7872
    prefetch:
      - {repo: infinith/UltraShape, allow: ["ultrashape_v1.pt"]}
      - {repo: facebook/dinov2-large, <<: *safetensors_only}
  trellis:
    python: /opt/venvs/trellis/bin/python
    script: workers/trellis_worker.py
    root: /opt/models/TRELLIS.2
    port: 7873
    prefetch:
      - {repo: microsoft/TRELLIS.2-4B}
      - {repo: microsoft/TRELLIS-image-large, allow: ["ckpts/ss_dec_conv3d_16l8_fp16.*"]}
      - {repo: camenduru/dinov3-vitl16-pretrain-lvd1689m}
      - {repo: ZhengPeng7/BiRefNet}
  pixal3d:
    python: /opt/venvs/pixal3d/bin/python
    script: workers/pixal3d_worker.py
    root: /opt/models/Pixal3D
    port: 7874
    prefetch:
      - {repo: TencentARC/Pixal3D, ignore: ["*_mv.*"]}
      - {repo: camenduru/dinov3-vitl16-pretrain-lvd1689m}
      - {repo: Ruicheng/moge-2-vitl}
      - {repo: ZhengPeng7/BiRefNet}
  hi3d:
    python: /opt/venvs/hi3d/bin/python
    script: workers/hi3d_worker.py
    root: /opt/models/Hi3Dv1.0
    port: 7875
    prefetch:
      - {repo: hi3d-official/Hi3Dv1.0}
      - {repo: facebook/dinov2-large, <<: *safetensors_only}
      - {repo: openai/clip-vit-large-patch14, <<: *safetensors_only}

generators:
  hunyuan:
    label: Hunyuan3D 2.1
    worker: hunyuan
    up: y
    notes: Solid all-rounder, the model your old template used. About 10 GB VRAM.
    params:
      steps: {type: int, default: 30, min: 5, max: 100, step: 1, label: Inference steps}
      guidance_scale: {type: float, default: 5.0, min: 1.0, max: 15.0, step: 0.5, label: Guidance scale}
      octree_resolution: {type: int, default: 384, min: 256, max: 512, step: 32, label: Mesh grid resolution, info: Higher keeps finer detail; 512 needs more VRAM}
      num_chunks: {type: int, default: 200000, min: 20000, max: 1000000, step: 20000, label: Decode chunk size, advanced: true}
  trellis:
    label: TRELLIS.2
    worker: trellis
    up: y
    notes: Strongest open model on 3D Arena; good with sharp edges and thin parts. Needs 24 GB+, 1536 is slow.
    params:
      resolution: {type: choice, choices: ["512", "1024", "1536"], default: "1024", label: Resolution}
      ss_steps: {type: int, default: 12, min: 4, max: 50, step: 1, label: Structure steps, advanced: true}
      ss_guidance_strength: {type: float, default: 7.5, min: 1.0, max: 10.0, step: 0.1, label: Structure guidance, advanced: true}
      shape_steps: {type: int, default: 12, min: 4, max: 50, step: 1, label: Shape steps, advanced: true}
      shape_guidance_strength: {type: float, default: 7.5, min: 1.0, max: 10.0, step: 0.1, label: Shape guidance, advanced: true}
      decimation_target: {type: int, default: 1000000, min: 100000, max: 2000000, step: 100000, label: Faces kept by the exporter, advanced: true}
  pixal3d:
    label: Pixal3D
    worker: pixal3d
    up: y
    notes: Pixel-aligned, so it follows the artwork most closely. ~18 GB VRAM, ~10-12 GB in low-VRAM mode.
    params:
      resolution: {type: choice, choices: ["1024", "1536"], default: "1536", label: Resolution}
      fov: {type: float, default: -1.0, min: -1.0, max: 1.0, step: 0.05, label: Camera FOV (radians), info: -1 estimates it with MoGe-2; try 0.2 if the result looks stretched}
      low_vram: {type: bool, default: false, label: Low-VRAM mode}
      ss_steps: {type: int, default: 12, min: 4, max: 50, step: 1, label: Structure steps, advanced: true}
      shape_steps: {type: int, default: 12, min: 4, max: 50, step: 1, label: Shape steps, advanced: true}

refiners:
  ultrashape:
    label: UltraShape 1.0
    worker: ultrashape
    up: y
    notes: Adds fine geometric detail. Trained on Hunyuan3D 2.1 coarse meshes, so it pairs best with that generator.
    params:
      steps: {type: int, default: 50, min: 12, max: 100, step: 1, label: Steps, info: 12 is much faster with a small quality cost}
      octree_res: {type: int, default: 1024, min: 512, max: 2048, step: 128, label: Mesh grid resolution}
      num_latents: {type: int, default: 32768, min: 8192, max: 65536, step: 4096, label: Latent tokens, advanced: true}
      chunk_size: {type: int, default: 8000, min: 2048, max: 32000, step: 1024, label: Decode chunk size, advanced: true}
      low_vram: {type: bool, default: false, label: Low-VRAM mode, advanced: true}
  hi3d:
    label: Hi3D v1.0 (experimental)
    worker: hi3d
    up: y
    notes: Geometry refiner up to 1536. Released Oct 2026; 1536 was only validated on a 96 GB GPU, so use an 80 GB card or CPU offload.
    params:
      resolution: {type: choice, choices: ["512", "1024", "1536"], default: "1024", label: Resolution}
      steps: {type: int, default: 25, min: 10, max: 50, step: 1, label: Steps per pass}
      cpu_offload: {type: bool, default: false, label: Sequential CPU offload, info: Slower, lowers VRAM}

print:
  heights_mm: [28, 32, 54, 75]
  faces: {"40k": 40000, "200k": 200000, "500k": 500000, "Keep all": 0}
  defaults:
    target_height_mm: 32
    target_faces: 200000
    flatten_base_mm: 0.3
    min_component_ratio: 0.02
    remesh_if_open: false
    remesh_cell_mm: 0.05

background_removal:
  # rembg model used when an upload has no transparency.
  models: [birefnet-general, isnet-general-use, u2net]
  default: birefnet-general
