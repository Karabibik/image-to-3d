name: build-image

# Tests the UI/print-prep code, then builds the pod image and pushes it to Docker Hub.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).
#   push to main  -> :main and :sha-<short>
#   tag v1.2.3    -> :v1.2.3 and :latest   (use version tags in the RunPod template)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "runpod/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - run: python -m pytest -q tests

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # The image is ~25 GB and the build compiles several CUDA extensions; the default
      # runner disk is too small, so drop preinstalled toolchains and build on /mnt.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Move Docker data to /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/image-to-3d
          tags: |
            type=semver,pattern=v{{version}}
            type=ref,event=branch
            type=sha,prefix=sha-
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/image-to-3d:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/image-to-3d:buildcache,mode=max
