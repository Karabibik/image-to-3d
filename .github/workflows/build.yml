name: build-image

# Tests the UI/print-prep code, then builds the pod image and pushes it to Docker Hub.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).
#   push to main  -> :main and :sha-<short>
#   tag v1.2.3    -> :v1.2.3 and :latest   (use version tags in the RunPod template)
# A failing test or build step posts its log tail as a public annotation.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "runpod/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: System libraries for pymeshlab
        run: sudo apt-get update -q && sudo apt-get install -y -q libopengl0 libgl1 libglu1-mesa libegl1
      - run: pip install -r app/requirements.txt
      - name: Run tests
        run: |
          set +e
          python -m pytest -q -rfE tests 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || python .github/annotate_tail.py "pytest failed" pytest.log 40
          exit "$status"

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # The image is ~25 GB and the build compiles several CUDA extensions; the default
      # runner disk is too small, so drop preinstalled toolchains and build on /mnt.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Move Docker data to /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/image-to-3d
          tags: |
            type=semver,pattern=v{{version}}
            type=ref,event=branch
            type=sha,prefix=sha-
          flavor: latest=auto
      - name: Build and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          CACHE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/image-to-3d:buildcache
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
          while read -r label; do [ -n "$label" ] && args+=(--label "$label"); done <<< "$LABELS"
          set +e
          docker buildx build . -f docker/Dockerfile --platform linux/amd64 --push --progress=plain \
            --cache-from "type=registry,ref=$CACHE" --cache-to "type=registry,ref=$CACHE,mode=max" \
            "${args[@]}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || python3 .github/annotate_tail.py "docker build failed" build.log 80
          exit "$status"
      - name: Disk usage after build
        if: always()
        run: df -h / /mnt
